name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version kommt aus dem packageManager-Feld in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: TypeScript prüfen
        run: pnpm check

      - name: Formatierung prüfen (Prettier)
        run: pnpm exec prettier --check .

      - name: Tests ausführen
        run: pnpm test

      - name: Produktions-Build
        run: pnpm run build

  db-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: citest
          MYSQL_DATABASE: campmesser
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcitest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:citest@127.0.0.1:3306/campmesser
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Migrationen gegen frische Datenbank anwenden
        run: pnpm exec drizzle-kit migrate
      - name: Auth-Flow-Integrationstest
        run: pnpm vitest run server/dbIntegration.test.ts

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile
      - name: Produktions-Build
        run: pnpm run build
      - name: Chromium installieren
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-Tests (Playwright)
        run: pnpm exec playwright test
